<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>父の日ビール診断</title>
<style>
*{box-sizing:border-box}
body{
  font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
  background:linear-gradient(170deg,#2e2419 0%,#4a3a26 55%,#5c4930 100%);
  margin:0;padding:22px 16px 40px;min-height:100vh;color:#2d2d2d;
}
.card{
  background:#fdfbf7;border-radius:18px;max-width:430px;margin:0 auto;
  box-shadow:0 14px 44px rgba(0,0,0,.3);overflow:hidden;
}

/* ヘッダー */
.head{
  background:linear-gradient(135deg,#a8763a 0%,#c99a52 100%);
  padding:30px 24px 26px;text-align:center;color:#fff;position:relative;
}
.head::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:16px;
  background:radial-gradient(circle at 10px -4px,#fdfbf7 9px,transparent 9px) repeat-x;
  background-size:20px 16px;
}
.head .mug{font-size:44px;line-height:1;margin-bottom:8px}
h1{font-size:23px;margin:0 0 6px;font-weight:700;letter-spacing:.06em}
.head .sub{font-size:12.5px;opacity:.93;letter-spacing:.04em}

.body{padding:26px 24px 30px}

/* 進捗バー */
.progress{display:none;margin-bottom:22px}
.progress-bar{height:5px;background:#ece4d6;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#c99a52,#e0b76a);width:0;transition:width .35s ease;border-radius:3px}
.progress-txt{font-size:11px;color:#a08f76;text-align:right;margin-top:7px;letter-spacing:.05em}

/* イントロ */
.intro-lead{font-size:14px;line-height:1.95;color:#5a4a35;text-align:center;margin-bottom:6px}
.intro-note{
  background:#f5efe3;border-radius:10px;padding:15px 17px;margin:22px 0 4px;
  font-size:12.5px;line-height:1.85;color:#7a6a52;
}
.intro-note b{color:#5a4a35}

/* 質問 */
.q-num{
  display:inline-block;background:#c99a52;color:#fff;font-size:11px;font-weight:700;
  padding:4px 11px;border-radius:11px;letter-spacing:.09em;margin-bottom:13px;
}
.q-text{font-size:17.5px;font-weight:700;line-height:1.6;color:#3d3428;margin-bottom:22px}
.opt{
  display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #e5dbc9;
  border-radius:11px;padding:15px 17px;margin-bottom:11px;font-size:14.5px;
  font-family:inherit;color:#3d3428;line-height:1.55;transition:all .18s;
}
.opt:hover{border-color:#c99a52;background:#fffdf8;transform:translateX(3px)}
.opt:active{transform:scale(.985)}
.opt .emo{margin-right:9px;font-size:16px}

/* 結果 */
.result-head{text-align:center;margin-bottom:22px}
.result-label{font-size:11.5px;color:#a08f76;letter-spacing:.15em;margin-bottom:9px}
.result-emoji{font-size:56px;line-height:1;margin-bottom:12px}
.result-type{font-size:22px;font-weight:700;color:#8b5e2a;line-height:1.45;margin-bottom:9px}
.result-catch{font-size:13px;color:#7a6a52;line-height:1.8}

.beer-box{
  background:linear-gradient(160deg,#fffdf8,#f7f0e2);
  border:1.5px solid #e5dbc9;border-radius:13px;padding:20px;margin:22px 0;
}
.beer-label{font-size:10.5px;color:#a08f76;letter-spacing:.13em;margin-bottom:9px;text-align:center}
.beer-name{font-size:19px;font-weight:700;color:#8b5e2a;text-align:center;margin-bottom:5px}
.beer-sub{font-size:11.5px;color:#a08f76;text-align:center;margin-bottom:16px;letter-spacing:.04em}
.beer-desc{font-size:13.5px;line-height:1.95;color:#5a4a35}

.tags{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.tag{background:#ece0cb;color:#8b6f47;font-size:11px;padding:5px 11px;border-radius:12px;letter-spacing:.03em}

.spec{margin-top:18px;padding-top:16px;border-top:1px dashed #ddd0ba}
.spec-row{display:flex;align-items:center;gap:11px;margin-bottom:11px;font-size:12px}
.spec-row:last-child{margin-bottom:0}
.spec-name{width:44px;color:#a08f76;flex-shrink:0;letter-spacing:.04em}
.spec-bar{flex:1;height:6px;background:#ece4d6;border-radius:3px;overflow:hidden}
.spec-fill{height:100%;background:linear-gradient(90deg,#c99a52,#e0b76a);border-radius:3px}

.btn{
  width:100%;padding:15px;border:0;border-radius:11px;font-size:15.5px;font-weight:700;
  font-family:inherit;letter-spacing:.06em;transition:all .2s;
}
.btn-main{
  background:linear-gradient(135deg,#a8763a,#c99a52);color:#fff;
  box-shadow:0 5px 16px rgba(168,118,58,.35);margin-top:8px;
}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(168,118,58,.45)}
.btn-main:active{transform:translateY(0)}
.btn-sub{background:none;border:1.5px solid #ddd0ba;color:#8b6f47;margin-top:11px}
.btn-sub:hover{background:#f7f0e2}

.foot{text-align:center;font-size:10.5px;color:#a08f76;padding:0 24px 22px;letter-spacing:.04em;line-height:1.8}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="mug">🍺</div>
    <h1>父の日ビール診断</h1>
    <div class="sub">5つの質問で、お父さんにぴったりの一本が見つかります</div>
  </div>

  <div class="body">
    <div class="progress" id="progress">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-txt" id="progressTxt">質問 1 / 5</div>
    </div>
    <div id="screen"></div>
  </div>

  <div class="foot" id="foot">
    ※ 診断結果は目安です。お父さまのお好みに合わせてお選びください
  </div>
</div>

<script>
var questions = [
  {
    q: 'お父さんがビールを飲むのは、どんなとき？',
    opts: [
      { emo:'🌇', t:'仕事終わりの一杯が何よりの楽しみ', s:{ rich:2, light:0, craft:0, classic:1 } },
      { emo:'🍖', t:'食事と一緒にゆっくり味わう', s:{ rich:1, light:0, craft:2, classic:0 } },
      { emo:'☀️', t:'休日の昼間から気持ちよく', s:{ rich:0, light:2, craft:1, classic:0 } },
      { emo:'👥', t:'人が集まる場でにぎやかに', s:{ rich:0, light:1, craft:0, classic:2 } }
    ]
  },
  {
    q: '味の好みは、どちらに近い？',
    opts: [
      { emo:'💪', t:'しっかりコクがあって飲みごたえがある', s:{ rich:3, light:0, craft:1, classic:0 } },
      { emo:'💧', t:'すっきりキレがよく後を引かない', s:{ rich:0, light:3, craft:0, classic:1 } },
      { emo:'🌿', t:'香りが華やかで個性がある', s:{ rich:0, light:0, craft:3, classic:0 } },
      { emo:'🍺', t:'昔から飲み慣れた安心の味', s:{ rich:1, light:1, craft:0, classic:3 } }
    ]
  },
  {
    q: '新しいものへの反応は？',
    opts: [
      { emo:'✨', t:'珍しいものは、まず試してみたい', s:{ rich:0, light:0, craft:3, classic:0 } },
      { emo:'🤔', t:'興味はあるが、結局いつものに戻る', s:{ rich:1, light:1, craft:1, classic:2 } },
      { emo:'🎯', t:'決めた銘柄をずっと飲み続ける', s:{ rich:1, light:0, craft:0, classic:3 } },
      { emo:'🔄', t:'その日の気分で選ぶタイプ', s:{ rich:1, light:2, craft:1, classic:0 } }
    ]
  },
  {
    q: 'お父さんの休日の過ごし方は？',
    opts: [
      { emo:'⛳', t:'ゴルフや釣りなど、外で体を動かす', s:{ rich:1, light:2, craft:0, classic:1 } },
      { emo:'📺', t:'家でスポーツ観戦や映画をゆっくり', s:{ rich:2, light:0, craft:0, classic:2 } },
      { emo:'🍳', t:'料理やDIYなど、こだわって作る', s:{ rich:0, light:0, craft:3, classic:0 } },
      { emo:'🚶', t:'散歩や買い物でのんびり', s:{ rich:0, light:2, craft:1, classic:1 } }
    ]
  },
  {
    q: '贈るとき、どんな気持ちを伝えたい？',
    opts: [
      { emo:'🙏', t:'いつもありがとう、という感謝', s:{ rich:2, light:0, craft:0, classic:2 } },
      { emo:'🎁', t:'たまには贅沢してほしい', s:{ rich:2, light:0, craft:2, classic:0 } },
      { emo:'😌', t:'ゆっくり休んでほしい', s:{ rich:0, light:2, craft:1, classic:1 } },
      { emo:'🥂', t:'今度一緒に飲もう、という誘い', s:{ rich:1, light:1, craft:1, classic:1 } }
    ]
  }
];

var results = {
  rich: {
    emoji:'🏅', type:'どっしり重厚タイプ',
    catch:'一日の終わりを、深い余韻で締めくくる。<br>飲みごたえを何より大切にするお父さんです。',
    beer:'プレミアムラガー 深煎り', sub:'PREMIUM LAGER / Alc. 6.0%',
    desc:'長期熟成による厚みのある麦の旨みと、ロースト香のほろ苦さが特長です。一口目からしっかりとした満足感があり、肉料理や煮込みとよく合います。「今日はよく働いた」という日に、静かに開けたい一本です。',
    tags:['コク重視','食事と一緒に','ギフト定番'],
    spec:{ コク:92, 苦み:78, 香り:60, キレ:38 }
  },
  light: {
    emoji:'🌊', type:'爽快キレ味タイプ',
    catch:'一杯目の「うまい」を、何度でも。<br>後に残らない軽やかさを好むお父さんです。',
    beer:'クリアドラフト 生', sub:'CLEAR DRAFT / Alc. 5.0%',
    desc:'雑味を抑えたクリアな仕上がりで、喉ごしのよさが際立ちます。よく冷やして飲むと、キレのある後味が心地よく続きます。揚げ物やさっぱりした和食との相性がよく、暑い季節に特におすすめです。',
    tags:['すっきり','よく冷やして','日常使い'],
    spec:{ コク:42, 苦み:48, 香り:45, キレ:95 }
  },
  craft: {
    emoji:'🌾', type:'こだわり探求タイプ',
    catch:'味わうことそのものを、楽しむ。<br>新しい発見を歓迎するお父さんです。',
    beer:'クラフトIPA 香り仕立て', sub:'CRAFT IPA / Alc. 5.5%',
    desc:'複数のホップを重ね、柑橘とハーブを思わせる華やかな香りに仕上げました。飲むほどに表情が変わり、グラスを傾けるたびに新しい発見があります。チーズやスパイス料理と合わせると、香りの重なりが一層引き立ちます。',
    tags:['香り豊か','個性派','飲み比べに'],
    spec:{ コク:68, 苦み:85, 香り:96, キレ:52 }
  },
  classic: {
    emoji:'🕰', type:'王道クラシックタイプ',
    catch:'変わらない味が、いちばん落ち着く。<br>長年の相棒を大切にするお父さんです。',
    beer:'クラシックラガー 定番', sub:'CLASSIC LAGER / Alc. 5.0%',
    desc:'создан創業以来の製法を守り続けた、飽きのこない味わいです。突出した個性はありませんが、どんな食事にも寄り添い、毎日飲んでも疲れません。「やっぱりこれだな」と言われる、そんな一本です。',
    tags:['安定の味','毎日飲める','間違いなし'],
    spec:{ コク:66, 苦み:62, 香り:55, キレ:70 }
  }
};

var current = 0;
var scores = { rich:0, light:0, craft:0, classic:0 };

function showIntro(){
  document.getElementById('progress').style.display = 'none';
  document.getElementById('screen').className = 'fade';
  document.getElementById('screen').innerHTML =
    '<div class="intro-lead">お父さんのことを思い浮かべながら、<br>5つの質問に答えてください。</div>'
  + '<div class="intro-note">診断結果をもとに、<b>お父さんの好みに合った一本</b>をご提案します。'
  + 'そのままギフトとしてご購入いただけます。</div>'
  + '<button class="btn btn-main" onclick="startQuiz()">診断をはじめる</button>';
}

function startQuiz(){
  current = 0;
  scores = { rich:0, light:0, craft:0, classic:0 };
  document.getElementById('progress').style.display = 'block';
  showQuestion();
}

function showQuestion(){
  var q = questions[current];
  var pct = ((current) / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressTxt').textContent = '質問 ' + (current + 1) + ' / ' + questions.length;

  var html = '<div class="q-num">Q' + (current + 1) + '</div>'
           + '<div class="q-text">' + q.q + '</div>';
  q.opts.forEach(function(o, i){
    html += '<button class="opt" onclick="answer(' + i + ')">'
          + '<span class="emo">' + o.emo + '</span>' + o.t + '</button>';
  });

  var el = document.getElementById('screen');
  el.className = '';
  el.innerHTML = html;
  void el.offsetWidth;
  el.className = 'fade';
}

function answer(i){
  var s = questions[current].opts[i].s;
  for (var k in s) scores[k] += s[k];
  current++;
  if (current < questions.length) showQuestion();
  else showResult();
}

function showResult(){
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressTxt').textContent = '診断完了';

  var top = 'rich', max = -1;
  for (var k in scores) if (scores[k] > max) { max = scores[k]; top = k; }
  var r = results[top];

  var specHtml = '';
  for (var name in r.spec) {
    specHtml += '<div class="spec-row"><div class="spec-name">' + name + '</div>'
              + '<div class="spec-bar"><div class="spec-fill" style="width:' + r.spec[name] + '%"></div></div></div>';
  }

  var tagHtml = r.tags.map(function(t){ return '<span class="tag">' + t + '</span>'; }).join('');

  var el = document.getElementById('screen');
  el.className = '';
  el.innerHTML =
    '<div class="result-head">'
  + '<div class="result-label">診 断 結 果</div>'
  + '<div class="result-emoji">' + r.emoji + '</div>'
  + '<div class="result-type">' + r.type + '</div>'
  + '<div class="result-catch">' + r.catch + '</div>'
  + '</div>'
  + '<div class="beer-box">'
  + '<div class="beer-label">お す す め の 一 本</div>'
  + '<div class="beer-name">' + r.beer + '</div>'
  + '<div class="beer-sub">' + r.sub + '</div>'
  + '<div class="beer-desc">' + r.desc + '</div>'
  + '<div class="tags">' + tagHtml + '</div>'
  + '<div class="spec">' + specHtml + '</div>'
  + '</div>'
  + '<button class="btn btn-main">この商品を見る</button>'
  + '<button class="btn btn-sub" onclick="showIntro()">もう一度診断する</button>';
  void el.offsetWidth;
  el.className = 'fade';
}

showIntro();
</script>
</body>
</html>
