<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>父の日カプセルメッセージ</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,'Hiragino Sans',sans-serif;background:#eef0f5;margin:0;padding:16px;color:#333}
.card{background:#fff;border-radius:14px;padding:24px;max-width:420px;margin:0 auto;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:21px;margin:0 0 4px}
.sub{color:#8a8a8a;font-size:13px;margin-bottom:18px}
.note{background:#f3f0fb;border-left:3px solid #6b4fbb;padding:11px 13px;border-radius:6px;font-size:13px;line-height:1.6;margin-bottom:18px}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 5px}
input,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:15px;font-family:inherit}
textarea{min-height:120px;resize:vertical}
button{width:100%;margin-top:20px;padding:14px;background:#6b4fbb;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:600}
button:disabled{background:#bbb}
#status{margin-top:14px;padding:11px;border-radius:8px;font-size:14px;text-align:center;display:none}
.ok{display:block!important;background:#e8f5e9;color:#2e7d32}
.ng{display:block!important;background:#ffebee;color:#c62828}
</style>
</head>
<body>
<div class="card">
  <h1>父の日カプセルメッセージ</h1>
  <div class="sub">来年の父の日に、お父さんへ届きます</div>

  <div class="note">
    今日書いたメッセージを保管し、来年の父の日前日にお父さんのLINEへ自動でお届けします。내용はいつでも書き換えられます。
  </div>

  <label>あなたの名前</label>
  <input type="text" id="name" placeholder="例：太郎">

  <label>お父さんのLINE ID</label>
  <input type="text" id="father" placeholder="Uから始まるID">

  <label>メッセージ</label>
  <textarea id="msg" placeholder="お父さんへ..."></textarea>

  <button id="save">カプセルに保存する</button>
  <div id="status"></div>
</div>

<script>
var GAS_URL = 'ここにGASのデプロイURL（/execで終わるもの）を貼る';

function show(text, cls){
  var s = document.getElementById('status');
  s.textContent = text;
  s.className = cls;
}

document.getElementById('save').addEventListener('click', function(){
  var btn    = document.getElementById('save');
  var name   = document.getElementById('name').value.trim();
  var father = document.getElementById('father').value.trim();
  var msg    = document.getElementById('msg').value.trim();

  if (!name || !father || !msg) { show('すべての項目を入力してください', 'ng'); return; }

  btn.disabled = true;
  show('保存中...', 'ok');

  var params = 'action=save'
    + '&childUserId='  + encodeURIComponent('demo-' + Date.now())
    + '&childName='    + encodeURIComponent(name)
    + '&fatherUserId=' + encodeURIComponent(father)
    + '&message='      + encodeURIComponent(msg);

  var cb = 'cb' + Date.now();
  window[cb] = function(res){
    btn.disabled = false;
    show(res.success ? '保存しました。来年の父の日にお届けします' : '保存に失敗しました', res.success ? 'ok' : 'ng');
    delete window[cb];
  };

  var s = document.createElement('script');
  s.src = GAS_URL + '?' + params + '&callback=' + cb;
  s.onerror = function(){ btn.disabled = false; show('通信エラーが発生しました', 'ng'); };
  document.body.appendChild(s);
});
</script>
</body>
</html>
