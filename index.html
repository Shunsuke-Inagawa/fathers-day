<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>父の日カプセルメッセージ</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:16px}
.card{background:#fff;border-radius:12px;padding:20px;max-width:420px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#888;font-size:13px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;box-sizing:border-box}
textarea{min-height:110px;resize:vertical}
button{width:100%;margin-top:18px;padding:13px;background:#6b4fbb;color:#fff;border:0;border-radius:8px;font-size:16px}
#status{margin-top:14px;padding:10px;border-radius:8px;font-size:14px;text-align:center}
.ok{background:#e8f5e9;color:#2e7d32}
.ng{background:#ffebee;color:#c62828}
</style>
</head>
<body>
<div class="card">
  <h1>父の日カプセルメッセージ</h1>
  <div class="sub">来年の父の日に、お父さんへ届きます</div>
  <div id="status">読み込み中...</div>

  <div id="form" style="display:none">
    <label>あなたの名前</label>
    <input type="text" id="name" placeholder="例：太郎">

    <label>お父さんのLINE ID</label>
    <input type="text" id="father" placeholder="Uから始まるID">

    <label>メッセージ</label>
    <textarea id="msg" placeholder="お父さんへ..."></textarea>

    <button id="save">保存する</button>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
var GAS_URL = 'ここにGASのデプロイURL（/execで終わるもの）を貼る';
var myUserId = '';

function show(text, cls){
  var s = document.getElementById('status');
  s.textContent = text;
  s.className = cls || '';
}

liff.init({ liffId: '2011527955-56Y6X4lv' })
  .then(function(){
    if (!liff.isLoggedIn()) { liff.login(); return; }
    return liff.getProfile();
  })
  .then(function(profile){
    if (!profile) return;
    myUserId = profile.userId;
    show('こんにちは、' + profile.displayName + 'さん', 'ok');
    document.getElementById('form').style.display = 'block';
  })
  .catch(function(err){
    show('エラー: ' + err.code + ' / ' + err.message, 'ng');
  });

document.getElementById('save').addEventListener('click', function(){
  var name = document.getElementById('name').value;
  var father = document.getElementById('father').value;
  var msg = document.getElementById('msg').value;

  if (!name || !father || !msg) { show('すべて入力してください', 'ng'); return; }
  show('保存中...');

  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'save',
      childUserId: myUserId,
      childName: name,
      fatherUserId: father,
      message: msg
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    show(res.success ? '保存しました！来年の父の日に届きます' : '保存に失敗しました', res.success ? 'ok' : 'ng');
  })
  .catch(function(e){
    show('通信エラー: ' + e.message, 'ng');
  });
});
</script>
</body>
</html>
