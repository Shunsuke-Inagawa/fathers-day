<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カプセルメッセージ</title>
<style>
*{box-sizing:border-box}
body{
  font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
  background:linear-gradient(170deg,#f5f3f0 0%,#ede8e3 100%);
  margin:0;padding:24px 16px 40px;color:#2d2d2d;min-height:100vh;
}
.card{
  background:#fff;border-radius:16px;max-width:430px;margin:0 auto;
  box-shadow:0 8px 28px rgba(0,0,0,.12);overflow:hidden;
}
.head{
  background:linear-gradient(135deg,#9b8b7e 0%,#b0a091 100%);
  padding:32px 24px 28px;text-align:center;color:#fff;position:relative;
  transition:background .3s ease;
}
.head.event-fathers-day{background:linear-gradient(135deg,#8b7b6e 0%,#a9998a 100%)}
.head.event-mothers-day{background:linear-gradient(135deg,#b38fa8 0%,#c9a8bb 100%)}
.head.event-children-day{background:linear-gradient(135deg,#7ca583 0%,#96b99a 100%)}
.head.event-birthday{background:linear-gradient(135deg,#c4a472 0%,#d4b687 100%)}

.head::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:4px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 12px,transparent 12px 24px);
}
.icon{font-size:42px;line-height:1;margin-bottom:10px;transition:transform .2s}
h1{font-size:22px;margin:0 0 6px;letter-spacing:.04em;font-weight:600;color:#fff}
.sub{font-size:13px;opacity:.92;letter-spacing:.03em;color:#fff}
.body{padding:26px}
.note{
  background:#f9f7f4;border-left:3px solid #b0a091;
  padding:14px 16px;border-radius:9px;font-size:13px;line-height:1.8;
  margin-bottom:22px;color:#5a5a5a;
}
label{display:block;font-size:13px;font-weight:600;margin:18px 0 7px;color:#3d3d3d;letter-spacing:.02em}
select,input,textarea{
  width:100%;padding:12px 13px;border:1.5px solid #e0d8d0;border-radius:9px;
  font-size:15px;font-family:inherit;background:#fefcfa;transition:border-color .2s;
  color:#2d2d2d;
}
select:focus,input:focus,textarea:focus{outline:none;border-color:#9b8b7e}
textarea{min-height:130px;resize:vertical;line-height:1.7}

.photo-upload{margin:18px 0;padding:14px;background:#f9f7f4;border-radius:9px;border:1.5px dashed #e0d8d0;text-align:center}
.photo-upload input[type="file"]{display:none}
.photo-upload label{margin:0;font-size:13px;color:#7a6a5a;cursor:pointer;font-weight:600}
.photo-upload label:hover{text-decoration:underline}
#photoPreview{
  width:100%;max-height:200px;border-radius:8px;object-fit:cover;
  margin-top:12px;display:none;
}
.photo-info{font-size:11px;color:#9b8b7a;margin-top:8px}

button{
  width:100%;margin-top:24px;padding:15px;
  background:linear-gradient(135deg,#9b8b7e 0%,#b0a091 100%);
  color:#fff;border:0;border-radius:9px;font-size:16px;font-weight:600;
  letter-spacing:.05em;box-shadow:0 4px 14px rgba(155,139,126,.3);
  transition:all .2s;
}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 18px rgba(155,139,126,.4)}
button:active{transform:translateY(0)}
button:disabled{background:#d4ccc4;box-shadow:none;opacity:.6}

#status{margin-top:16px;padding:13px;border-radius:9px;font-size:14px;text-align:center;display:none;line-height:1.6}
.ok{display:block!important;background:#f0f8f4;color:#2d7a5a;border:1px solid #d4e8dc}
.ng{display:block!important;background:#fef4f4;color:#a33a32;border:1px solid #f0cfcc}

.foot{text-align:center;font-size:11px;color:#9b8b7a;padding:0 26px 24px;letter-spacing:.03em}

/* プレビュー */
#preview{display:none;max-width:430px;margin:26px auto 0}
.pv-lead{text-align:center;color:#7a7a7a;font-size:13px;letter-spacing:.06em;margin-bottom:12px;line-height:1.8}
.pv-lead strong{display:block;font-size:15px;color:#9b8b7e;font-weight:600;margin-bottom:3px}
.phone{background:#b0a89a;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.talk-bar{background:#8a7f77;color:#fff;padding:12px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.talk-bar .back{opacity:.85;font-size:16px}
.talk{padding:16px 14px 22px;min-height:320px;background:#fff}
.day{text-align:center;margin-bottom:16px}
.day span{background:rgba(0,0,0,.12);color:#5a5a5a;font-size:11px;padding:4px 12px;border-radius:11px;letter-spacing:.04em}
.row{display:flex;gap:8px;margin-bottom:14px;align-items:flex-end}
.icon2{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:#e0d8d0;color:#7a6a5a;font-size:20px;
  display:flex;align-items:center;justify-content:center;
}
.bubble{background:#f5f5f5;border-radius:4px 16px 16px 16px;padding:13px 15px;font-size:14px;line-height:1.75;max-width:270px;box-shadow:0 1px 3px rgba(0,0,0,.08);color:#3d3d3d}
.time{font-size:10px;color:rgba(0,0,0,.5);align-self:flex-end;padding-bottom:2px}
.letter{background:#fefcfa;border-radius:4px 16px 16px 16px;max-width:275px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.letter-top{background:linear-gradient(135deg,#9b8b7e,#b0a091);color:#fff;padding:11px 15px;font-size:12px;font-weight:600;letter-spacing:.05em}
.letter-body{padding:15px;font-size:14px;line-height:1.85;color:#3d3d3d;white-space:pre-wrap}
.letter-photo{width:100%;height:140px;object-fit:cover;margin:10px 0}
.letter-from{border-top:1px dashed #d4ccc4;margin-top:13px;padding-top:11px;font-size:12px;color:#8a7a6a;text-align:right}
.pv-caption{text-align:center;color:#8a7a7a;font-size:11px;margin-top:14px;line-height:1.8}
</style>
</head>
<body>
<div class="card">
  <div class="head" id="headClass">
    <div class="icon" id="headIcon">💌</div>
    <h1 id="headTitle">カプセルメッセージ</h1>
    <div class="sub">大切な日に、メッセージが届きます</div>
  </div>

  <div class="body">
    <div class="note">
      大切な日のために、今からメッセージと写真を保管しておきましょう。その日が来たら、相手のLINEへ自動で届きます。内容はいつでも書き換えられます。
    </div>

    <label>どの日のメッセージ？</label>
    <select id="event">
      <option value="">選択してください</option>
      <option value="fathers-day">👔 父の日（6月）</option>
      <option value="mothers-day">🌸 母の日（5月）</option>
      <option value="children-day">🎏 こどもの日（5月5日）</option>
      <option value="birthday">🎂 誕生日</option>
    </select>

    <label id="birthdayLabel" style="display:none">誕生日を入力</label>
    <input type="date" id="birthdate" style="display:none">

    <label>あなたの名前</label>
    <input type="text" id="name" placeholder="例：太郎">

    <label>相手のLINE ID</label>
    <input type="text" id="recipient" placeholder="相手のLINE IDを入力">

    <label>メッセージ</label>
    <textarea id="msg" placeholder="メッセージを書いてください&#10;&#10;例：いつもありがとう。"></textarea>

    <label>写真を追加</label>
    <div class="photo-upload">
      <label for="photoFile">📷 クリックして写真を選択</label>
      <input type="file" id="photoFile" accept="image/*">
      <img id="photoPreview" alt="プレビュー">
      <div class="photo-info" id="photoInfo"></div>
    </div>

    <button id="save">メッセージと写真を保存する</button>
    <div id="status"></div>
  </div>

  <div class="foot">💌 その日まで、大切にお預かりします</div>
</div>

<div id="preview">
  <div class="pv-lead">
    <strong id="pvDateLabel">― その日 ―</strong>
    相手のLINEには、こう届きます
  </div>

  <div class="phone">
    <div class="talk-bar"><span class="back">‹</span> メッセージ</div>
    <div class="talk">
      <div class="day"><span id="pvDate">日付</span></div>

      <div class="row">
        <div class="icon2">💌</div>
        <div class="bubble">大切なメッセージが届いています。</div>
        <div class="time">9:00</div>
      </div>

      <div class="row">
        <div class="icon2">💌</div>
        <div class="letter">
          <div class="letter-top">✉ メッセージが届きました</div>
          <div class="letter-body">
            <img id="pvPhoto" class="letter-photo" style="display:none">
            <span id="pvMsg"></span>
            <div class="letter-from">― <span id="pvName"></span> より</div>
          </div>
        </div>
        <div class="time">9:00</div>
      </div>
    </div>
  </div>

  <div class="pv-caption">※ 指定された日に、この内容が自動配信されます</div>
</div>

<script>
var GAS_URL = 'ここにGASのデプロイURL（/execで終わるもの）を貼る';
var selectedPhoto = null;

// イベント設定
var events = {
  'fathers-day': {
    icon: '👔',
    title: 'カプセルメッセージ',
    classname: 'event-fathers-day',
    calc: function() { return calcNthSunday(new Date().getFullYear() + 1, 5, 3, -1); },
    label: '― 1年後 ―'
  },
  'mothers-day': {
    icon: '🌸',
    title: 'カプセルメッセージ',
    classname: 'event-mothers-day',
    calc: function() { return calcNthSunday(new Date().getFullYear() + 1, 4, 2, -1); },
    label: '― 1年後 ―'
  },
  'children-day': {
    icon: '🎏',
    title: 'カプセルメッセージ',
    classname: 'event-children-day',
    calc: function() { return new Date(new Date().getFullYear() + 1, 4, 4); },
    label: '― 来年 ―'
  },
  'birthday': {
    icon: '🎂',
    title: 'カプセルメッセージ',
    classname: 'event-birthday',
    calc: function() { return null; },
    label: '― 来年のお誕生日 ―'
  }
};

function calcNthSunday(y, m, n, offset) {
  var d = new Date(y, m, 1);
  var firstSunday = 1 + ((7 - d.getDay()) % 7);
  return new Date(y, m, firstSunday + (n - 1) * 7 + offset);
}

document.getElementById('event').addEventListener('change', function() {
  var evt = events[this.value];
  if (!evt) {
    document.getElementById('headClass').className = 'head';
    document.getElementById('headIcon').textContent = '💌';
    document.getElementById('headTitle').textContent = 'カプセルメッセージ';
    document.getElementById('birthdayLabel').style.display = 'none';
    document.getElementById('birthdate').style.display = 'none';
    return;
  }
  
  document.getElementById('headClass').className = 'head ' + evt.classname;
  document.getElementById('headIcon').textContent = evt.icon;
  document.getElementById('headTitle').textContent = evt.title;
  
  if (this.value === 'birthday') {
    document.getElementById('birthdayLabel').style.display = 'block';
    document.getElementById('birthdate').style.display = 'block';
  } else {
    document.getElementById('birthdayLabel').style.display = 'none';
    document.getElementById('birthdate').style.display = 'none';
  }
});

document.getElementById('photoFile').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;

  var reader = new FileReader();
  reader.onload = function(event) {
    selectedPhoto = event.target.result;
    document.getElementById('photoPreview').src = selectedPhoto;
    document.getElementById('photoPreview').style.display = 'block';
    document.getElementById('photoInfo').textContent = '✓ ' + file.name + ' (' + (file.size / 1024).toFixed(0) + ' KB)';
  };
  reader.readAsDataURL(file);
});

function show(text, cls) {
  var s = document.getElementById('status');
  s.textContent = text;
  s.className = cls;
}

document.getElementById('save').addEventListener('click', function() {
  var btn = document.getElementById('save');
  var eventType = document.getElementById('event').value;
  var name = document.getElementById('name').value.trim();
  var recipient = document.getElementById('recipient').value.trim();
  var msg = document.getElementById('msg').value.trim();

  if (!eventType || !name || !recipient || !msg) {
    show('すべての項目を入力してください', 'ng');
    return;
  }

  btn.disabled = true;
  show('保存中...', 'ok');

  var evt = events[eventType];
  var deliveryDate;
  
  if (eventType === 'birthday') {
    var bd = document.getElementById('birthdate').value;
    if (!bd) { show('誕生日を選択してください', 'ng'); btn.disabled = false; return; }
    var parts = bd.split('-');
    deliveryDate = new Date(new Date().getFullYear() + 1, parseInt(parts[1]) - 1, parseInt(parts[2]));
  } else {
    deliveryDate = evt.calc();
  }

  var params = 'action=save'
    + '&childUserId=' + encodeURIComponent('demo-' + Date.now())
    + '&childName=' + encodeURIComponent(name)
    + '&fatherUserId=' + encodeURIComponent(recipient)
    + '&message=' + encodeURIComponent(msg)
    + '&eventType=' + encodeURIComponent(eventType)
    + '&deliveryDate=' + encodeURIComponent(deliveryDate.toISOString().split('T')[0]);

  var cb = 'cb' + Date.now();
  window[cb] = function(res) {
    btn.disabled = false;
    if (res.success) {
      show('保存しました。指定の日にお届けします', 'ok');
      showPreview(name, msg, eventType, deliveryDate);
    } else {
      show('保存に失敗しました', 'ng');
    }
    delete window[cb];
  };

  var s = document.createElement('script');
  s.src = GAS_URL + '?' + params + '&callback=' + cb;
  s.onerror = function() { btn.disabled = false; show('通信エラーが発生しました', 'ng'); };
  document.body.appendChild(s);
});

function showPreview(name, msg, eventType, deliveryDate) {
  document.getElementById('pvMsg').textContent = msg;
  document.getElementById('pvName').textContent = name;

  if (selectedPhoto) {
    document.getElementById('pvPhoto').src = selectedPhoto;
    document.getElementById('pvPhoto').style.display = 'block';
  } else {
    document.getElementById('pvPhoto').style.display = 'none';
  }

  var w = ['日','月','火','水','木','金','土'][deliveryDate.getDay()];
  document.getElementById('pvDate').textContent =
    deliveryDate.getFullYear() + '年' + (deliveryDate.getMonth() + 1) + '月' + deliveryDate.getDate() + '日（' + w + '）';

  var pvLabel = events[eventType].label || '― その日 ―';
  document.getElementById('pvDateLabel').textContent = pvLabel;

  var pv = document.getElementById('preview');
  pv.style.display = 'block';
  setTimeout(function() { pv.scrollIntoView({behavior:'smooth'}); }, 300);
}
</script>
</body>
</html>
