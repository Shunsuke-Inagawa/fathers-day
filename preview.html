<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配信イメージ｜父の日カプセルメッセージ</title>
<style>
*{box-sizing:border-box}
body{
  font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
  background:linear-gradient(170deg,#2c3e50 0%,#3d5166 45%,#4a5f75 100%);
  margin:0;padding:32px 16px 48px;min-height:100vh;
}
.wrap{max-width:430px;margin:0 auto}
.lead{text-align:center;color:#e8e0d0;font-size:13px;letter-spacing:.06em;margin-bottom:18px;line-height:1.8}
.lead strong{display:block;font-size:16px;color:#f0d98a;font-weight:700;margin-bottom:4px;letter-spacing:.12em}

.phone{background:#8fa8c8;border-radius:16px;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.32)}
.talk-bar{background:#5b7ba3;color:#fff;padding:12px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.talk-bar .back{opacity:.85;font-size:16px}
.talk{padding:16px 14px 24px;min-height:280px}
.day{text-align:center;margin-bottom:16px}
.day span{background:rgba(0,0,0,.18);color:#fff;font-size:11px;padding:4px 12px;border-radius:11px;letter-spacing:.04em}
.row{display:flex;gap:8px;margin-bottom:14px;align-items:flex-end}
.icon{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;background:#3d5f3d;color:#fff;
  font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;
}
.bubble{background:#fff;border-radius:4px 16px 16px 16px;padding:13px 15px;font-size:14px;line-height:1.75;max-width:270px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.time{font-size:10px;color:rgba(255,255,255,.85);align-self:flex-end;padding-bottom:2px}
.letter{background:#fdfbf7;border-radius:4px 16px 16px 16px;max-width:275px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.letter-top{background:linear-gradient(135deg,#8b6f47,#a8834f);color:#fff;padding:11px 15px;font-size:12px;font-weight:700;letter-spacing:.05em}
.letter-body{padding:15px;font-size:14px;line-height:1.85;color:#3d3428;white-space:pre-wrap}
.letter-from{border-top:1px dashed #ddd0ba;margin-top:13px;padding-top:11px;font-size:12px;color:#8b6f47;text-align:right}
.caption{text-align:center;color:#c3ccd8;font-size:11px;margin-top:16px;line-height:1.9}

.edit{margin-top:30px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:18px}
.edit h2{font-size:12px;color:#e8e0d0;margin:0 0 14px;letter-spacing:.1em;font-weight:600;text-align:center}
.edit label{display:block;font-size:11px;color:#b9c4d2;margin:12px 0 5px;letter-spacing:.04em}
.edit input,.edit textarea{
  width:100%;padding:9px 11px;border:1px solid rgba(255,255,255,.22);border-radius:7px;
  font-size:13px;font-family:inherit;background:rgba(255,255,255,.94);color:#2d2d2d;
}
.edit textarea{min-height:100px;resize:vertical;line-height:1.7}
.edit .hide{margin-top:16px;width:100%;padding:9px;background:none;border:1px solid rgba(255,255,255,.3);
  color:#c3ccd8;border-radius:7px;font-size:12px;font-family:inherit}
.toggle{display:block;margin:22px auto 0;padding:8px 20px;background:none;border:1px solid rgba(255,255,255,.28);
  color:#c3ccd8;border-radius:20px;font-size:12px;font-family:inherit;letter-spacing:.05em}
</style>
</head>
<body>
<div class="wrap">

  <div class="lead">
    <strong>― 1年後 ―</strong>
    お父さんのLINEには、こう届きます
  </div>

  <div class="phone">
    <div class="talk-bar"><span class="back">‹</span> <span id="vBrand2">○○ビール</span></div>
    <div class="talk">
      <div class="day"><span id="vDate">2027年6月19日（土）</span></div>

      <div class="row">
        <div class="icon" id="vIcon">○○<br>ビール</div>
        <div class="bubble">お父さん、明日は父の日ですね。<br>1年前、お子さまからお預かりしていたメッセージが届いています。</div>
        <div class="time">9:00</div>
      </div>

      <div class="row">
        <div class="icon" id="vIcon2">○○<br>ビール</div>
        <div class="letter">
          <div class="letter-top">✉ カプセルメッセージが届きました</div>
          <div class="letter-body"><span id="vMsg"></span><div class="letter-from">― <span id="vName">太郎</span> より</div></div>
        </div>
        <div class="time">9:00</div>
      </div>
    </div>
  </div>

  <div class="caption">※ 1年前に書かれたメッセージが、この日に自動配信されます</div>

  <button class="toggle" id="toggle">内容を編集する</button>

  <div class="edit" id="edit" style="display:none">
    <h2>プレビュー編集</h2>

    <label>ブランド名</label>
    <input type="text" id="eBrand" value="○○ビール">

    <label>差出人（お子さまの名前）</label>
    <input type="text" id="eName" value="太郎">

    <label>メッセージ</label>
    <textarea id="eMsg">お父さんへ

いつも仕事で忙しいのに、休みの日は文句も言わずに付き合ってくれてありがとう。
面と向かうと照れくさくて言えないので、ここに書きました。

体だけは大事にしてください。
今年も一緒に飲みましょう。</textarea>

    <button class="hide" id="hide">編集を閉じる</button>
  </div>

</div>

<script>
// 6月の第3日曜（父の日）
function thirdSunday(y){
  var d = new Date(y, 5, 1);
  return new Date(y, 5, 1 + ((7 - d.getDay()) % 7) + 14);
}

function setDate(){
  var y = new Date().getFullYear() + 1;
  var d = thirdSunday(y);
  d.setDate(d.getDate() - 1);
  var w = ['日','月','火','水','木','金','土'][d.getDay()];
  document.getElementById('vDate').textContent =
    y + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日（' + w + '）';
}

function render(){
  var brand = document.getElementById('eBrand').value || '○○ビール';
  document.getElementById('vBrand2').textContent = brand;

  var half = Math.ceil(brand.length / 2);
  var iconHtml = brand.length > 3
    ? brand.slice(0, half) + '<br>' + brand.slice(half)
    : brand;
  document.getElementById('vIcon').innerHTML  = iconHtml;
  document.getElementById('vIcon2').innerHTML = iconHtml;

  document.getElementById('vName').textContent = document.getElementById('eName').value || '太郎';
  document.getElementById('vMsg').textContent  = document.getElementById('eMsg').value;
}

['eBrand','eName','eMsg'].forEach(function(id){
  document.getElementById(id).addEventListener('input', render);
});

document.getElementById('toggle').addEventListener('click', function(){
  var e = document.getElementById('edit');
  var open = e.style.display === 'block';
  e.style.display = open ? 'none' : 'block';
  this.textContent = open ? '内容を編集する' : '編集中';
  if (!open) e.scrollIntoView({behavior:'smooth'});
});

document.getElementById('hide').addEventListener('click', function(){
  document.getElementById('edit').style.display = 'none';
  document.getElementById('toggle').textContent = '内容を編集する';
});

setDate();
render();
</script>
</body>
</html>
